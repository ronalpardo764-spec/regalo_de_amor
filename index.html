<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Amor ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0d0000; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
            touch-action: manipulation;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; z-index: 10;
            width: 90%;
        }
        .btn-love {
            padding: 14px 32px; 
            border-radius: 30px; 
            border: none;
            background: linear-gradient(45deg, #ff0000, #a00000); 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.7); 
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-love:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 50, 50, 0.9); }

        #loader {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center; z-index: 10;
            width: 80%;
        }
        .spinner {
            width: 60px; height: 60px; 
            border: 4px solid rgba(255, 0, 0, 0.2);
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #porcentaje { font-size: 24px; color: #ff5050; }
        #subtitulo-carga { font-size: 16px; margin-top: 6px; color: #ffcccc; }

        #mensaje-amor {
            display: none; 
            position: absolute; 
            top: 5%; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 90%; 
            max-width: 400px; 
            background: transparent; 
            padding: 0; 
            border: none; 
            color: #fff; 
            font-size: 20px; 
            text-align: center; 
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 0, 0, 1), 0 0 25px rgba(255, 0, 0, 0.8);
            z-index: 100; 
            pointer-events: none;
        }
    </style>
    <!-- Importar Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- REPRODUCTOR DE MÚSICA CON SOPORTE MÓVIL -->
    <audio id="musica-fondo" loop playsinline preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div id="canvas-container"></div>

    <div id="ui">
        <button class="btn-love" onclick="iniciarCarga()">Toque aquí mi amor (de RUBEN) ❤️</button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div id="porcentaje">0%</div>
        <div id="subtitulo-carga">Cargando nuestras fotos y recuerdos... ❤️</div>
    </div>

    <div id="mensaje-amor">
        ✨❤️<br>
        Eres mi universo y mi pasión eterna ❤️<br>
        ✨
    </div>

    <script>
        let scene, camera, renderer, controls;
        let particulas, texto3DGroup;

        // 100 FRASES DE AMOR
        const frasesAmor = [
            "Te amo ❤️", "Eres mi vida ✨", "Mi amor eterno 💖", "Siempre juntos 💍",
            "Mi lugar favorito eres tú 🌹", "Eres mi sueño hecho realidad 💫",
            "Cada segundo a tu lado vale la pena 💗", "Amor de mi vida ✨💖",
            "Gracias por existir 🥰", "Eres mi persona favorita ✨🤍",
            "Mi corazón te elige 💘", "Juntos por siempre ♾️",
            "Haces mi mundo más hermoso ✨🌍", "Eres mi todo 👑💖",
            "Nunca te vayas de mi lado 🥹❤️", "Te amo infinitamente ♾️❤️",
            "Mi destino eres tú 🌌", "Eres mi luz en la oscuridad 🌟",
            "Amo tu sonrisa 😍", "Tus abrazos son mi hogar 🏡❤️",
            "Eres el amor de mis sueños 💭❤️", "Contigo todo es mejor 🌸",
            "Me haces el hombre más feliz 👑", "Mi corazón es tuyo 💓",
            "Razones para amar sobra contigo ✨", "Amo cada detalle tuyo 🌹",
            "Eres lo más lindo de mi vida 💖", "Mi reina hermosa 👑❤️",
            "Eternamente tuyo 💖", "Gracias por cada momento 🥰",
            "Tu amor me llena el alma 🌟", "Eres mi galaxia entera 🌌✨",
            "Juntos contra el mundo 🌎❤️", "Amo tu voz 🥰",
            "Siempre en mi mente 💭❤️", "Mi mayor bendición 🙏❤️",
            "Eres mi razón de ser ❤️", "Contigo hasta el fin del mundo 🪐",
            "Mi único y verdadero amor 💘", "Te amaré por siempre 💖",
            "Mi felicidad lleva tu nombre 🥰", "Eres mi calma y mi locura ❤️",
            "Me enamoras cada día más 🌹", "Tus besos son mi adicción 💋",
            "Contigo el tiempo vuela ⏳✨", "Eres la mitad que me faltaba 🧩",
            "Mi lugar seguro eres tú 🛡️❤️", "Amo caminar de tu mano 🤝❤️",
            "Eres mi inspiración 🎨💖", "No hay nadie como tú ✨",
            "Nuestra historia es mi favorita 📚❤️", "Me haces bien al alma 🤍",
            "Eres mi pensamiento favorito 💭", "Estar contigo es mágico ✨",
            "Te elijo hoy y siempre 💍", "Tu amor me da fuerzas 🦁❤️",
            "Eres el sol de mis días ☀️", "Mi estrella fugaz hecha realidad 🌠",
            "Amo cada mirada tuya 👀❤️", "Siento mariposas contigo 🦋",
            "Eres mi complemento perfecto 💖", "A tu lado todo es perfecto ✨",
            "Contigo aprendí a amar ❤️", "Eres mi pedacito de cielo ☁️💖",
            "Mi mundo entero gira hacia ti 🌍", "Gracias por hacerme sonreír 😊",
            "Eres lo más valioso para mí 💎", "No te cambio por nada 👑",
            "Tenerte es un regalo del cielo 🎁❤️", "Amo compartir mi vida contigo 💖",
            "Mi corazón late fuerte por ti 💓", "Eres mi alegría de cada día ☀️",
            "Amo la forma en que me miras 🥺❤️", "Mi rincón favorito es a tu lado 🏡",
            "Eres mi presente y mi futuro ⏳❤️", "Contigo hasta la eternidad ♾️",
            "Eres mi mayor tesoro 💎❤️", "Me encantas por completo 😍",
            "Amo cuando nos abrazamos fuerte 🤗", "Mi día mejora cuando te veo ✨",
            "Tu risa es mi sonido favorito 🎶", "No hay distancia que apague esto 🌌",
            "Eres mi mejor regalo 🎁💖", "Te cuido porque te amo ❤️",
            "Amo crear recuerdos contigo 📸", "Eres mi motivo para sonreír 💖",
            "Nacimos para estar juntos 🧩❤️", "Eres mi ángel en la tierra 🪽",
            "No me canso de mirarte 🥰", "Te amo más de lo que imaginas 💓",
            "Eres la mejor parte de mi vida ✨", "Mi amor por ti no tiene fin ♾️",
            "Eres único en este mundo 👑", "Gracias por tanto amor 🥰",
            "Contigo quiero envejecer 👵👴❤️", "Eres mi mayor suerte 🍀",
            "Amo todo de ti 🌹", "Simplemente te amo ❤️"
        ];

        // Las 4 imágenes
        const listaImagenes = [
            "WhatsApp Image 2026-08-12 at 5.11.50 PM.jpeg",
            "WhatsApp Image 2026-08-12 at 5.11.52 PM.jpeg",
            "WhatsApp Image 2026-08-12 at 5.11.51 PM (1).jpeg",
            "WhatsApp Image 2026-08-12 at 5.11.51 PM.jpeg"
        ];

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d0000, 0.01);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 48);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.2;

            crearEfectoFondo();
            crearTextoTeAmoPuntos();
            crearFrasesFlotantesDistribuidas();
            crearFotosFlotantes();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function crearEfectoFondo() {
            const numParticulas = 4000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(numParticulas * 3);
            const colors = new Float32Array(numParticulas * 3);

            for (let i = 0; i < numParticulas * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 160;
                positions[i + 1] = (Math.random() - 0.5) * 160;
                positions[i + 2] = (Math.random() - 0.5) * 160;

                colors[i] = 1.0; 
                colors[i + 1] = Math.random() * 0.2; 
                colors[i + 2] = Math.random() * 0.2; 
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.6,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            particulas = new THREE.Points(geometry, material);
            scene.add(particulas);
        }

        function crearTextoTeAmoPuntos() {
            texto3DGroup = new THREE.Group();

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            ctx.fillStyle = 'white';
            ctx.font = 'bold 70px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('TE AMO', 256, 85);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            const puntosGeometria = new THREE.BufferGeometry();
            const posiciones = [];

            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const alpha = data[(y * canvas.width + x) * 4 + 3];
                    if (alpha > 128) {
                        const posX = (x - canvas.width / 2) * 0.11;
                        const posY = -(y - canvas.height / 2) * 0.11;
                        const posZ = (Math.random() - 0.5) * 2;
                        posiciones.push(posX, posY, posZ);
                    }
                }
            }

            puntosGeometria.setAttribute('position', new THREE.Float32BufferAttribute(posiciones, 3));

            const material = new THREE.PointsMaterial({
                color: 0xff0022,
                size: 0.5,
                transparent: true,
                opacity: 0.95
            });

            const puntosMesh = new THREE.Points(puntosGeometria, material);
            texto3DGroup.add(puntosMesh);
            scene.add(texto3DGroup);
        }

        function crearFrasesFlotantesDistribuidas() {
            const totalFrases = frasesAmor.length;
            const phi = Math.PI * (3 - Math.sqrt(5));

            frasesAmor.forEach((texto, i) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1024;
                canvas.height = 256;

                ctx.font = 'bold 54px Segoe UI, Arial';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 18;
                ctx.fillText(texto, 512, 128);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMaterial);

                const y = 1 - (i / (totalFrases - 1)) * 2; 
                const radiusAtY = Math.sqrt(1 - y * y);
                const theta = phi * i;

                const radioGlobal = 16 + (i % 4) * 5; 

                sprite.position.x = Math.cos(theta) * radiusAtY * radioGlobal;
                sprite.position.y = y * (radioGlobal * 0.85);
                sprite.position.z = Math.sin(theta) * radiusAtY * radioGlobal;

                sprite.scale.set(15, 3.75, 1);
                scene.add(sprite);
            });
        }

        function crearFotosFlotantes() {
            const textureLoader = new THREE.TextureLoader();

            listaImagenes.forEach((url, index) => {
                textureLoader.load(encodeURIComponent(url), (texture) => {
                    const spriteMaterial = new THREE.SpriteMaterial({
                        map: texture,
                        transparent: true
                    });

                    const sprite = new THREE.Sprite(spriteMaterial);

                    const angle = (index / listaImagenes.length) * Math.PI * 2;
                    const radius = 15;

                    sprite.position.x = radius * Math.cos(angle);
                    sprite.position.y = (index % 2 === 0 ? 3 : -3);
                    sprite.position.z = radius * Math.sin(angle);

                    sprite.scale.set(8, 10, 1);
                    scene.add(sprite);
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls) controls.update();

            if (particulas) {
                particulas.rotation.y += 0.0006;
            }

            if (texto3DGroup) {
                texto3DGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.15;
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        function iniciarCarga() {
            const audio = document.getElementById('musica-fondo');
            
            // Activar permisos de audio en celular con el primer toque
            if (audio) {
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                }).catch(e => console.log("Audio listo para sonar tras carga"));
            }

            document.getElementById('ui').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            let porcentaje = 0;
            const elemPorcentaje = document.getElementById('porcentaje');

            const intervalo = setInterval(() => {
                porcentaje += Math.floor(Math.random() * 8) + 3;
                if (porcentaje >= 100) {
                    porcentaje = 100;
                    clearInterval(intervalo);

                    // Reproducir la música sin bloqueo del móvil
                    if (audio) {
                        audio.play().catch(e => console.log("Error al reproducir audio:", e));
                    }

                    setTimeout(() => {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('mensaje-amor').style.display = 'block';
                        initThree();
                    }, 400);
                }
                elemPorcentaje.innerText = porcentaje + '%';
            }, 120);
        }
    </script>
</body>
</html>
