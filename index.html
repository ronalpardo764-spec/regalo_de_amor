<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Amor ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0d0000; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
            touch-action: manipulation;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; z-index: 10;
            width: 90%;
        }
        .btn-love {
            padding: 12px 30px; 
            border-radius: 30px; 
            border: none;
            background: linear-gradient(45deg, #ff0000, #a00000); 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.7); 
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-love:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 50, 50, 0.9); }

        #loader {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center; z-index: 10;
            width: 80%;
        }
        .spinner {
            width: 60px; height: 60px; 
            border: 4px solid rgba(255, 0, 0, 0.2);
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #porcentaje { font-size: 24px; color: #ff5050; }
        #subtitulo-carga { font-size: 16px; margin-top: 6px; color: #ffcccc; }

        /* TEXTO FLOTANTE ARRIBA SIN CUADRADO */
        #mensaje-amor {
            display: none; 
            position: absolute; 
            top: 6%; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 90%; 
            max-width: 380px; 
            background: transparent; 
            padding: 0; 
            border: none; 
            color: #fff; 
            font-size: 18px; 
            text-align: center; 
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 0, 0, 1), 0 0 25px rgba(255, 0, 0, 0.8);
            z-index: 100; 
            pointer-events: none;
        }
    </style>
    <!-- Importar Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Música de fondo -->
    <audio id="musica-fondo" loop src="Marc Seguí - Tiroteo Remix ft (mp3cut.net).mp3"></audio>

    <div id="canvas-container"></div>

    <div id="ui">
        <button class="btn-love" onclick="iniciarCarga()">Haz clic aquí mi amor ❤️</button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div id="porcentaje">0%</div>
        <div id="subtitulo-carga">Cargando nuestras fotos y recuerdos... ❤️</div>
    </div>

    <div id="mensaje-amor">
        ✨❤️<br>
        Eres mi universo y mi pasión eterna ❤️<br>
        ✨
    </div>

    <script>
        let scene, camera, renderer, controls;
        let particulas, texto3DGroup;

        // Lista extendida con muchísimos más mensajes de amor
        const frasesAmor = [
            "Te amo ❤️", "Eres mi vida ✨", "Mi amor eterno 💖", "Siempre juntos 💍",
            "Mi lugar favorito eres tú 🌹", "Eres mi sueño hecho realidad 💫",
            "Cada segundo a tu lado vale la pena 💗", "Amor de mi vida ✨💖",
            "Gracias por existir 🥰", "Eres mi persona favorita ✨🤍",
            "Mi corazón te elige 💘", "Juntos por siempre ♾️",
            "Haces mi mundo más hermoso ✨🌍", "Eres mi todo 👑💖",
            "Nunca te vayas de mi lado 🥹❤️", "Te amo infinitamente ♾️❤️",
            "Mi destino eres tú 🌌", "Eres mi luz en la oscuridad 🌟",
            "Amo tu sonrisa 😍", "Tus abrazos son mi hogar 🏡❤️",
            "Eres el amor de mis sueños 💭❤️", "Contigo todo es mejor 🌸",
            "Me haces el hombre más feliz 👑", "Mi corazón es tuyo 💓",
            "Razones para amar sobra contigo ✨", "Amo cada detalle tuyo 🌹",
            "Eres lo más lindo de mi vida 💖", "Mi reina hermosa 👑❤️",
            "Eternamente tuyo 💖", "Gracias por cada momento 🥰",
            "Tu amor me llena el alma 🌟", "Eres mi galaxia entera 🌌✨",
            "Juntos contra el mundo 🌎❤️", "Amo tu voz 🥰",
            "Siempre en mi mente 💭❤️", "Mi mayor bendición 🙏❤️"
        ];

        // Rutas exactas a tus 4 fotos subidas a GitHub
        const listaImagenes = [
            "WhatsApp Image 2026-08-12 at 5.11.50 PM.jpeg",
            "WhatsApp Image 2026-08-12 at 5.11.52 PM.jpeg",
            "WhatsApp Image 2026-08-12 at 5.11.51 PM (1).jpeg",
            "WhatsApp Image 2026-08-12 at 5.11.51 PM.jpeg"
        ];

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d0000, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 48);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;

            crearEfectoFondo();
            crearTextoTeAmoPuntos();
            crearFrasesFlotantesRedondas();
            crearFotosFlotantes();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // Fondo de partículas
        function crearEfectoFondo() {
            const numParticulas = 3000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(numParticulas * 3);
            const colors = new Float32Array(numParticulas * 3);

            for (let i = 0; i < numParticulas * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 140;
                positions[i + 1] = (Math.random() - 0.5) * 140;
                positions[i + 2] = (Math.random() - 0.5) * 140;

                colors[i] = 1.0; 
                colors[i + 1] = Math.random() * 0.3; 
                colors[i + 2] = Math.random() * 0.3; 
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.6,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            particulas = new THREE.Points(geometry, material);
            scene.add(particulas);
        }

        // Formar "TE AMO" en 3D en el centro
        function crearTextoTeAmoPuntos() {
            texto3DGroup = new THREE.Group();

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            ctx.fillStyle = 'white';
            ctx.font = 'bold 70px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('TE AMO', 256, 85);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            const puntosGeometria = new THREE.BufferGeometry();
            const posiciones = [];

            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const alpha = data[(y * canvas.width + x) * 4 + 3];
                    if (alpha > 128) {
                        const posX = (x - canvas.width / 2) * 0.12;
                        const posY = -(y - canvas.height / 2) * 0.12;
                        const posZ = (Math.random() - 0.5) * 2;
                        posiciones.push(posX, posY, posZ);
                    }
                }
            }

            puntosGeometria.setAttribute('position', new THREE.Float32BufferAttribute(posiciones, 3));

            const material = new THREE.PointsMaterial({
                color: 0xff0022,
                size: 0.5,
                transparent: true,
                opacity: 0.95
            });

            const puntosMesh = new THREE.Points(puntosGeometria, material);
            texto3DGroup.add(puntosMesh);
            scene.add(texto3DGroup);
        }

        // Frases románticas más grandes y claras
        function crearFrasesFlotantesRedondas() {
            frasesAmor.forEach((texto) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1024;
                canvas.height = 256;

                // Estilo del texto más grueso, nítido y brillante
                ctx.font = 'bold 52px Segoe UI, Arial';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 20;
                ctx.fillText(texto, 512, 128);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });

                const sprite = new THREE.Sprite(spriteMaterial);

                // Distribución amplia por todo el espacio 3D
                const r = 16 + Math.random() * 24;
                const theta = Math.random() * Math.PI * 2;
                const phi = (Math.random() - 0.5) * Math.PI * 0.95;

                sprite.position.x = r * Math.cos(theta) * Math.cos(phi);
                sprite.position.y = r * Math.sin(phi);
                sprite.position.z = r * Math.sin(theta) * Math.cos(phi);

                // Tamaño aumentado para que se lean bien claritas
                sprite.scale.set(15, 3.75, 1);
                scene.add(sprite);
            });
        }

        // Cargar y hacer orbitar tus 4 fotos
        function crearFotosFlotantes() {
            const textureLoader = new THREE.TextureLoader();

            listaImagenes.forEach((url, index) => {
                textureLoader.load(encodeURIComponent(url), (texture) => {
                    const spriteMaterial = new THREE.SpriteMaterial({
                        map: texture,
                        transparent: true
                    });

                    const sprite = new THREE.Sprite(spriteMaterial);

                    const angle = (index / listaImagenes.length) * Math.PI * 2;
                    const radius = 22;

                    sprite.position.x = radius * Math.cos(angle);
                    sprite.position.y = (Math.random() - 0.5) * 8;
                    sprite.position.z = radius * Math.sin(angle);

                    sprite.scale.set(8.5, 10.5, 1);
                    scene.add(sprite);
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls) controls.update();

            if (particulas) {
                particulas.rotation.y += 0.0008;
            }

            if (texto3DGroup) {
                texto3DGroup.rotation.y = Math.sin(Date.now() * 0.001) * 0.15;
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        function iniciarCarga() {
            // Reproducir canción al dar clic
            const audio = document.getElementById('musica-fondo');
            if (audio) {
                audio.play().catch(e => console.log("Audio no iniciado: ", e));
            }

            document.getElementById('ui').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            let porcentaje = 0;
            const elemPorcentaje = document.getElementById('porcentaje');

            const intervalo = setInterval(() => {
                porcentaje += Math.floor(Math.random() * 8) + 3;
                if (porcentaje >= 100) {
                    porcentaje = 100;
                    clearInterval(intervalo);

                    setTimeout(() => {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('mensaje-amor').style.display = 'block';
                        initThree();
                    }, 400);
                }
                elemPorcentaje.innerText = porcentaje + '%';
            }, 120);
        }
    </script>
</body>
</html>
