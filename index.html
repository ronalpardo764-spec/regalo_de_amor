<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Rojo de Amor 🔴💖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #100000; /* Fondo rojo ultra oscuro */
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; z-index: 10;
        }
        .btn-love {
            padding: 18px 45px; border-radius: 35px; border: none;
            background: linear-gradient(45deg, #ff0000, #a00000); /* Gradiente rojo fuego */
            color: white; font-size: 22px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.9);
            transition: all 0.3s ease;
        }
        .btn-love:hover { transform: scale(1.1); box-shadow: 0 0 50px rgba(255, 50, 50, 1); }

        #loader {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center; z-index: 10;
        }
        .spinner {
            width: 80px; height: 80px;
            border: 5px solid rgba(255, 0, 0, 0.2);
            border-top: 5px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #mensaje-amor {
            display: none; position: absolute; bottom: 5%; left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 0, 0, 0.88); /* Fondo rojo burdeos oscuro */
            padding: 18px 35px; border-radius: 25px;
            border: 2px solid rgba(255, 50, 50, 0.8);
            color: #fff; font-size: 24px; text-align: center; font-weight: bold;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.7);
            z-index: 10; pointer-events: none;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <div id="ui">
        <button class="btn-love" id="btn-iniciar" onclick="iniciarCarga()">Toque aquí ❤️✨<br><small style="font-size: 14px; font-weight: normal;">Universo Rojo 🔴✨</small></button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <h2 id="porcentaje" style="font-size: 32px; color: #ff5050;">0%</h2>
        <p id="subtitulo-carga" style="font-size: 18px; margin-top: 8px; color: #ffcccc;">Encendiendo el universo rojo... ❤️✨</p>
    </div>

    <div id="mensaje-amor">
        ✨❤️ Eres mi universo y mi pasión eterna ❤️✨
    </div>

    <div id="canvas-container"></div>

    <!-- Librerías 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>

    <script>
        let scene, camera, renderer, controls;

        // TUS FOTOS (asegúrate de tenerlas en la carpeta)
        const listaImagenes = [
            'foto1.jpg',
            'foto2.jpg',
            'foto3.jpg'
        ];

        const frasesAmor = [
            "💖 Eres increíble 💖", "🏡✨ Mi lugar favorito ✨🏡", "💘 Mi corazón te elige 💘",
            "🌸 Gracias por existir 🌸", "💞 Qué bonito coincidir 💞", "😊❤️ Me haces feliz ❤️😊",
            "✨🌟 Tu luz me inspira 🌟✨", "👩‍❤️‍👨💖 Siempre contigo 💖👩‍❤️‍👨", "🌈💕 Contigo todo mejora 💕🌈",
            "👑❤️ Eres mi todo ❤️👑", "♾️💗 Te amo infinitamente 💗♾️", "💍✨ Juntos por siempre ✨💍",
            "🤍✨ Mi persona favorita ✨🤍", "🌹💖 Simplemente tú 💖🌹", "💘✨ Amor de mi vida ✨💘",
            "☀️💕 Mi sol en días nublados 💕☀️", "💫💖 Eres mi sueño hecho realidad 💖💫",
            "⏳💖 Cada segundo a tu lado vale la pena 💖⏳", "🏡💗 Mi hogar eres tú 💗🏡",
            "🥺❤️ Nunca te vayas de mi vida ❤️🥺", "🌍✨ Haces mi mundo más hermoso ✨🌍",
            "😊💖 Tu sonrisa es mi favorita 💖😊", "🧩💞 Mi complemento perfecto 💞🧩"
        ];

        function iniciarCarga() {
            if (typeof THREE === 'undefined') {
                alert("⚠️ Error: El internet está bloqueando la librería Three.js.");
                return;
            }

            document.getElementById('ui').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            let progreso = 0;
            const textos = [
                "Creando estrellas rojas centelleantes... ✨",
                "Cargando tus recuerdos en rojo... 📸❤️",
                "Formando el TE AMO incandescente... 💖✨",
                "Desplegando la galaxia de pasión... 🌟🔴"
            ];
            
            const intervalo = setInterval(() => {
                progreso += 2;
                document.getElementById('porcentaje').innerText = progreso + '%';
                
                if (progreso % 25 === 0) {
                    const idx = Math.floor(progreso / 25) - 1;
                    if(textos[idx]) document.getElementById('subtitulo-carga').innerText = textos[idx];
                }

                if (progreso >= 100) {
                    clearInterval(intervalo);
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('mensaje-amor').style.display = 'block';
                    try {
                        initGalaxia();
                    } catch(err) {
                        alert("Error iniciando la animación 3D: " + err.message);
                    }
                }
            }, 30);
        }

        function initGalaxia() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 55);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.8;
            }

            crearTextoTeAmoCentralRoja();
            crearGalaxiaRoja();
            crearMensajesFlotantesRoja();
            crearImagenesFlotantesRoja();

            animate();
        }

        // "TE AMO" EN ROJO BRILLANTE
        function crearTextoTeAmoCentralRoja() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 150;

            ctx.fillStyle = 'white';
            ctx.font = 'Bold 65px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('💖 TE AMO 💖', 300, 90);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            const points = [];
            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const alpha = data[(y * canvas.width + x) * 4 + 3];
                    if (alpha > 128) {
                        points.push({
                            x: (x - canvas.width / 2) * 0.11,
                            y: -(y - canvas.height / 2) * 0.11,
                            z: (Math.random() - 0.5) * 2.5
                        });
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(points.length * 3);
            const colors = new Float32Array(points.length * 3);

            points.forEach((p, i) => {
                positions[i * 3] = p.x;
                positions[i * 3 + 1] = p.y;
                positions[i * 3 + 2] = p.z;

                // Color Rojo Puro Brillante
                colors[i * 3] = 1.0;
                colors[i * 3 + 1] = 0.1;
                colors[i * 3 + 2] = 0.1;
            });

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.98
            });

            const textMesh = new THREE.Points(geometry, material);
            scene.add(textMesh);
        }

        // GALAXIA DE 6500 ESTRELLAS ROJAS
        function crearGalaxiaRoja() {
            const count = 6500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                const r = 18 + Math.random() * 48;
                const theta = Math.random() * Math.PI * 2;
                const phi = (Math.random() - 0.5) * Math.PI;

                positions[i] = r * Math.cos(theta) * Math.cos(phi);
                positions[i+1] = r * Math.sin(phi);
                positions[i+2] = r * Math.sin(theta) * Math.cos(phi);

                // Gradiente espacial rojo, carmesí y rosa fuerte
                colors[i] = 1.0; 
                colors[i+1] = Math.random() * 0.3; // Muy poco verde
                colors[i+2] = Math.random() * 0.4; // Un poco de azul para tono rosa
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.32, 
                vertexColors: true, 
                transparent: true, 
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Luz ambiental roja cálida
            const ambientLight = new THREE.PointLight(0xff0000, 2.5, 110);
            scene.add(ambientLight);
        }

        // MENSAJES CON RESPLANDOR ROJO
        function crearMensajesFlotantesRoja() {
            frasesAmor.forEach((texto) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 800;
                canvas.height = 180;

                ctx.fillStyle = '#ffffff';
                ctx.font = 'Bold 42px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff0000'; // Resplandor rojo neón
                ctx.shadowBlur = 22;
                ctx.fillText(texto, 400, 95);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMaterial);

                const r = 18 + Math.random() * 28;
                const theta = Math.random() * Math.PI * 2;
                const phi = (Math.random() - 0.5) * Math.PI * 0.85;

                sprite.position.x = r * Math.cos(theta) * Math.cos(phi);
                sprite.position.y = r * Math.sin(phi);
                sprite.position.z = r * Math.sin(theta) * Math.cos(phi);

                sprite.scale.set(16, 3.6, 1);
                scene.add(sprite);
            });
        }

        // FOTOS CON BORDE/AURA ROJA CÁLIDA
        function crearImagenesFlotantesRoja() {
            const textureLoader = new THREE.TextureLoader();

            listaImagenes.forEach((url) => {
                textureLoader.load(url, (texture) => {
                    // SpriteMaterial con color rojo base suave para teñir la foto
                    const spriteMaterial = new THREE.SpriteMaterial({ 
                        map: texture, 
                        transparent: true,
                        color: 0xffcccc // Tinte rojo pálido suave
                    });
                    const sprite = new THREE.Sprite(spriteMaterial);

                    const r = 14 + Math.random() * 20;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = (Math.random() - 0.5) * Math.PI * 0.8;

                    sprite.position.x = r * Math.cos(theta) * Math.cos(phi);
                    sprite.position.y = r * Math.sin(phi);
                    sprite.position.z = r * Math.sin(theta) * Math.cos(phi);

                    sprite.scale.set(8.5, 8.5, 1);
                    scene.add(sprite);
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
